name: Deploy Toni's Weather to GitHub Pages

# NOTE: This repo's environment has no hosted Actions runners, so we publish to
# the `gh-pages` branch directly instead. This workflow is kept for any future
# environment that DOES have runners — run it manually from the Actions tab, and
# set Pages source to "GitHub Actions".
on:
  workflow_dispatch:

# Allow the workflow to enable Pages and publish the built site.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Project site lives under /TonisWeather/
          VITE_BASE: /TonisWeather/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
